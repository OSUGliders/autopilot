[project]
name = "autopilot"
version = "0.1.0"
description = "Shore-side autopilot for Slocum gliders following drifting floats via SFMC"
requires-python = ">=3.12"
dependencies = [
    "dbdreader>=0.6.3",
    "flask>=3.0",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
    "sfmc-api",
    "shapely>=2.1.2",
    "simplekml>=1.3.6",
    "waitress>=3.0",
    "xarray>=2026.4.0",
]

[project.scripts]
autopilot-sim = "autopilot.sim.closed_loop:main"
autopilot-mock-data = "autopilot.sim.mock_data:main"
autopilot-live-drifter = "autopilot.sim.live_drifter:main"
autopilot-follow = "autopilot.launch:main"
autopilot-web = "autopilot.web:main"
autopilot-ingest-predictions = "autopilot.ingest:main"
autopilot-acoustic-watch = "autopilot.acoustic.watch:main"
autopilot-acoustic-staleness = "autopilot.acoustic.staleness:main"

[dependency-groups]
dev = [
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "pytest>=8",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
sfmc-api = { git = "https://github.com/mousebrains/SFMC-API-Python" }
