[Service]
# osusim lives on gliderfmc1, unlike real gliders (default gliderfmc0
# in the base template) -- pin it here instead of editing the shared
# template.
ExecStart=
ExecStart=/opt/autopilot/.venv/bin/sfmc-pull-new-downloads osusim \
    /srv/autopilot/acoustic-raw/osusim \
    --credentials /etc/autopilot/credentials.json \
    --host gliderfmc1.ceoas.oregonstate.edu
